# Matches the Cloudflare project name, which Workers Builds derives from the
# repo. A mismatch makes every CI deploy warn and silently override this.
name = "immersion-radio"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Static assets (the receiver UI). Requests that match a file here are served
# directly; everything else falls through to the Worker, which owns /api/*.
[assets]
directory = "./public"
binding = "ASSETS"

# The station's memory. A Durable Object needs no pre-provisioned resource id —
# `wrangler deploy` creates it from the migration below on first use — so there
# is nothing to set up by hand before deploying. It also serialises access,
# which read-modify-write state like play counts genuinely needs.
[[durable_objects.bindings]]
name = "STATION"
class_name = "Station"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Station"]

# Runtime logs in the dashboard. Salvaged from the config Cloudflare's connect
# flow generated: this project is driven from a browser, so when the Worker
# throws in production there is otherwise no way to see why.
[observability]
enabled = true

[vars]
IMMERSE_MODEL = "claude-sonnet-5"

# Secrets are NOT set here — they'd end up in git. Set them with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ACCESS_PASSWORD
#   npx wrangler secret put SESSION_SECRET
