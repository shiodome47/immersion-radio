# Matches the Cloudflare project name, which Workers Builds derives from the
# repo. A mismatch makes every CI deploy warn and silently override this.
name = "immersion-radio"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Static assets (the receiver UI). Requests that match a file here are served
# directly; everything else falls through to the Worker, which owns /api/*.
[assets]
directory = "./public"
binding = "ASSETS"

# The station's memory: sources, the segment library, and your level.
#
# ⚠️  DEPLOYS FAIL UNTIL THE id BELOW IS REAL. It cannot be filled in for you —
# a KV namespace id belongs to your Cloudflare account. Run:
#
#     npx wrangler kv namespace create STATION
#
# and paste the id it prints over the placeholder, then commit and push.
# `wrangler dev` simulates KV locally, so no preview_id is needed.
[[kv_namespaces]]
binding = "STATION"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

[vars]
IMMERSE_MODEL = "claude-sonnet-5"

# Secrets are NOT set here — they'd end up in git. Set them with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ACCESS_PASSWORD
#   npx wrangler secret put SESSION_SECRET
