name: CI

# Deployment is handled by Cloudflare's own Git integration (Workers Builds),
# which runs `npx wrangler deploy` on push. This workflow only guards the
# programming logic, so a red run here means the format clock is broken —
# not that the deploy failed.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
